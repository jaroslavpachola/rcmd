name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p rcmd-tui
      - name: Package
        run: |
          name="rcmd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/rcmd" README.md LICENSE CHANGELOG.md "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          files: rcmd-*.tar.gz
          generate_release_notes: false
          body_path: CHANGELOG.md
