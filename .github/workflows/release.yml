name: Release

on:
  push:
    tags: ["v*"]
  # dry-run: build and package everything, skip the release upload
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            flags: ""
          # static build: runs on any distro, no shared libs
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            flags: "--features vendored"
          # macOS: OpenSSL vendored too, so the binary does not need a
          # brew install on the machine that runs it
          - os: macos-13
            target: x86_64-apple-darwin
            flags: "--features vendored"
          - os: macos-latest
            target: aarch64-apple-darwin
            flags: "--features vendored"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.flags }} -p rcmd-tui
      - name: Verify static linkage
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          file "target/${{ matrix.target }}/release/rcmd"
          if ldd "target/${{ matrix.target }}/release/rcmd" 2>&1 | grep -q "=>"; then
            echo "::error::musl binary is not static" && exit 1
          fi
      - name: Smoke test
        run: "target/${{ matrix.target }}/release/rcmd --version"
      - name: Package
        run: |
          name="rcmd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/rcmd" README.md LICENSE CHANGELOG.md "$name/"
          cp -r contrib "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: rcmd-*.tar.gz
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: rcmd-*.tar.gz
          generate_release_notes: false
          body_path: CHANGELOG.md
