name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # The pty e2e suite is Linux-only (it drives the binary through
    # /dev/pts and installs shells with apt); macOS builds, lints and
    # runs the unit tests, which is what the platform support is.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flags: ""
          # vendored OpenSSL: the runner's own is a brew install that
          # openssl-sys has to go looking for, and a build that finds
          # nothing is a worse answer than one that compiles its own
          - os: macos-latest
            flags: "--features vendored"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.flags }} -- -D warnings
      - name: Unit tests
        run: cargo test --workspace ${{ matrix.flags }}
      - name: Build
        run: cargo build ${{ matrix.flags }}
      - name: Install paramiko (sftp e2e server)
        if: runner.os == 'Linux'
        run: pip3 install --user paramiko
      - name: Install shells (subshell e2e scenarios)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: End-to-end (pty)
        if: runner.os == 'Linux'
        run: RCMD_E2E_STEP=0.8 RCMD_SUBSHELL_LOG=/tmp/subshell.log python3 tests/e2e/run.py
      - name: End-to-end (pty, subshell on)
        if: runner.os == 'Linux'
        run: RCMD_E2E_STEP=0.8 RCMD_SUBSHELL_LOG=/tmp/subshell.log RCMD_E2E_SUBSHELL=1 python3 tests/e2e/run.py
      - name: Subshell state-machine log
        if: failure()
        run: cat /tmp/subshell.log || true
