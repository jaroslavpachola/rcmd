name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # macOS temporarily suspended (slow runner queues); re-add
    # macos-latest to the matrix to restore it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: Build
        run: cargo build
      - name: Install paramiko (sftp e2e server)
        if: runner.os == 'Linux'
        run: pip3 install --user paramiko
      - name: Install shells (subshell e2e scenarios)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: End-to-end (pty)
        if: runner.os == 'Linux'
        run: RCMD_E2E_STEP=0.8 RCMD_SUBSHELL_LOG=/tmp/subshell.log python3 tests/e2e/run.py
      - name: End-to-end (pty, subshell on)
        if: runner.os == 'Linux'
        run: RCMD_E2E_STEP=0.8 RCMD_SUBSHELL_LOG=/tmp/subshell.log RCMD_E2E_SUBSHELL=1 python3 tests/e2e/run.py
      - name: Subshell state-machine log
        if: failure()
        run: cat /tmp/subshell.log || true
