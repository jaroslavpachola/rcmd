[package]
name = "rcmd-tui-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "File-manager engine behind rcmd: directory listing, file operations, archive and FTP/SFTP virtual filesystems, find, compare and diff. TUI-free."
repository = "https://github.com/jaroslavpachola/rcmd"
homepage = "https://github.com/jaroslavpachola/rcmd"
readme = "../../README.md"
keywords = ["file-manager", "filesystem", "archive", "ftp", "vfs"]
categories = ["filesystem", "command-line-utilities"]

[lib]
# The published name is namespaced; the code has always said rcmd_core.
name = "rcmd_core"
path = "src/lib.rs"

[dependencies]
trash.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true
xz2.workspace = true
bzip2.workspace = true
ruzstd.workspace = true
regex.workspace = true
encoding_rs.workspace = true
ssh2.workspace = true
sha2.workspace = true
# getpwuid_r / getgrgid_r: who a uid belongs to, through NSS
libc.workspace = true

[features]
# Static builds (musl): compile OpenSSL from source instead of linking
# the system one. xz2/bzip2 already vendor via their "static" features.
vendored = ["ssh2/vendored-openssl"]

[dev-dependencies]
tempfile.workspace = true
