[package]
name = "rcmd-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
trash.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true
xz2.workspace = true
bzip2.workspace = true
ruzstd.workspace = true
ssh2.workspace = true

[features]
# Static builds (musl): compile OpenSSL from source instead of linking
# the system one. xz2/bzip2 already vendor via their "static" features.
vendored = ["ssh2/vendored-openssl"]

[dev-dependencies]
tempfile.workspace = true
