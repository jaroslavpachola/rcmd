[package]
name = "rcmd-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A Midnight Commander replacement in Rust: an orthodox dual-pane file manager with mc keybindings, a built-in viewer and editor, archive and FTP/SFTP panels."
repository = "https://github.com/jaroslavpachola/rcmd"
homepage = "https://github.com/jaroslavpachola/rcmd"
readme = "../../README.md"
keywords = ["file-manager", "tui", "midnight-commander", "orthodox", "ratatui"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "rcmd_tui"
path = "src/lib.rs"

[[bin]]
name = "rcmd"
path = "src/main.rs"

[features]
default = ["syntax", "git"]
syntax = ["rcmd-tui-edit/syntax"]
git = ["dep:git2"]
# Static builds (musl tarball): vendor the C dependencies.
vendored = ["rcmd-tui-core/vendored"]

[dependencies]
rcmd-tui-core = { path = "../rcmd-core", version = "4.28.1" }
rcmd-tui-edit = { path = "../rcmd-edit", version = "4.28.1" }
anyhow.workspace = true
ratatui.workspace = true
chrono.workspace = true
libc.workspace = true
serde.workspace = true
toml.workspace = true
notify.workspace = true
regex.workspace = true
git2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
