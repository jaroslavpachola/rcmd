[package]
name = "rcmd-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rcmd in a window: the orthodox dual-pane file manager, its ratatui drawing painted by egui instead of a terminal."
repository = "https://github.com/jaroslavpachola/rcmd"
homepage = "https://github.com/jaroslavpachola/rcmd"
readme = "../../README.md"
keywords = ["file-manager", "gui", "egui", "midnight-commander", "orthodox"]
categories = ["gui", "filesystem"]

[[bin]]
name = "rcmd-egui"
path = "src/main.rs"

[features]
default = ["syntax", "git"]
syntax = ["rcmd-tui/syntax"]
git = ["rcmd-tui/git"]
# Render two frames, write $EFRAME_SCREENSHOT_TO and exit. For the
# README's picture and for checking the grid without a pair of eyes.
screenshot = ["eframe/__screenshot"]

[dependencies]
rcmd-tui = { path = "../rcmd-tui", version = "4.30.1", default-features = false }
rcmd-tui-edit = { path = "../rcmd-edit", version = "4.30.1" }
ratatui.workspace = true
vt100.workspace = true
anyhow.workspace = true
# glow rather than the default wgpu: a cell grid is flat 2D drawing,
# and glow is the smaller dependency tree and the wider driver support
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# The window's own settings ([window] in config.toml, and the state it
# writes): the terminal build's Config ignores tables it does not know,
# so the window reads its table itself.
toml.workspace = true
serde.workspace = true
# System fonts by family name, for `font = "DejaVu Sans Mono"` and the
# Font dialog's list. Pure Rust; reads fontconfig's configuration on
# Linux and the usual directories elsewhere.
fontdb = "0.24"
