[workspace]
resolver = "2"
members = [
    "crates/rcmd-core",
    "crates/rcmd-edit",
    "crates/rcmd-tui",
    "crates/rcmd-egui",
]

[workspace.package]
version = "4.30.2"
edition = "2024"
license = "MIT"

# Release binaries: thin LTO buys ~10-20% size/speed at a small build
# cost, strip drops the debug info nobody ships.
[profile.release]
lto = "thin"
strip = true

[workspace.dependencies]
anyhow = "1"
ratatui = "0.29"
chrono = "0.4"
tempfile = "3"
trash = "5"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }
bzip2 = { version = "0.4", features = ["static"] }
# decode-only and pure Rust: a read-only VFS never compresses, and the
# musl static build stays free of another C library
ruzstd = "0.9"
# SHA-256 for the checksum files: pure Rust, so the static musl build
# stays free of another C library
sha2 = "0.10"
# Every legacy codepage mc offers, pure Rust and decode+encode both
# ways - the alternative is twenty single-byte tables by hand and no
# CJK at all
encoding_rs = "0.8"
# The interpreting half of a terminal: the pty and the shell are
# subshell.rs's already, this turns the bytes they produce into a
# screen for the window build's Ctrl+O pane. Alternate screen and
# application-cursor mode are what make vim and less work in it.
# Held at 0.15 because 0.16 wants unicode-width 0.2.1 and ratatui
# 0.29 pins that crate to exactly 0.2.0; 0.15 is on the 0.1 line,
# a different major, so the two coexist instead of conflicting.
vt100 = "0.15"
notify = "8"
ssh2 = "0.9"
git2 = { version = "0.20", default-features = false }
ropey = "1"
regex = "1"
syntect = { version = "5", default-features = false, features = [
    "default-fancy",
] }
